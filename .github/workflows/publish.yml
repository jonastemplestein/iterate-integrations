name: pkg.pr.new
# Every main commit publishes each package, so any main sha is installable:
#   https://pkg.pr.new/jonastemplestein/iterategrations/iterate-pebble@<sha>
# Never to npm. Needs the pkg.pr.new GitHub App on this repository (github.com/apps/pkg-pr-new).
on:
  push:
    branches: [main]
  pull_request:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true
      # its `prepare` builds every package: the type check and the tests read dist
      - run: vp install
      - run: vp check
      - run: pnpm test
      - run: pnpm dlx pkg-pr-new publish --pnpm ./pebble ./waitrose ./monzo
